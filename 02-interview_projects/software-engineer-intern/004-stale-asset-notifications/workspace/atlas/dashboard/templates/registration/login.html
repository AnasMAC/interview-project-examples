{% extends "dashboard/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="login">
  <h1>Log in to Atlas</h1>
  {% if form.errors %}<p class="error" role="alert">Your username and password did not match. Please try again.</p>{% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primary">Log in</button>
  </form>
</section>
{% endblock %}
