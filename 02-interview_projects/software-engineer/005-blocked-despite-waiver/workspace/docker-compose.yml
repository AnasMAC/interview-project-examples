# Local stack for Gatekeeper.
#
# Only `app` publishes a host port: 127.0.0.1:${GATE_PORT:-8090}. db, scheduler
# and ci-mock are reachable on the compose network only. No container_name is
# set, so several copies of the stack can run side by side with different
# COMPOSE_PROJECT_NAME values (CI and `make test` in parallel branches do this).
#
# GATE_NOW pins gatekeeper.core.clock.now() (dev only, see core/clock.py) to the
# demo data's "today" so reports, expiry and notices match the seed whatever the
# real date is. `GATE_NOW=2026-12-06T01:00:00Z make up` moves it; `GATE_NOW= make up`
# uses the wall clock. Tests ignore it and freeze their own clock.
name: gatekeeper

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: mossbank-gatekeeper:dev
  volumes:
    - ./:/app
  environment: &app-env
    GATE_ENV: dev
    PYTHONPATH: /app
    DATABASE_URL: postgresql+psycopg://gatekeeper:gatekeeper-demo@db:5432/gatekeeper
    GATE_LOG_LEVEL: INFO
    GATE_LOG_FORMAT: json
    GATE_NOW: ${GATE_NOW-2026-12-02T11:00:00Z}
  depends_on: &app-deps
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper-demo
      POSTGRES_DB: gatekeeper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    <<: *app
    environment:
      <<: *app-env
      GATE_SERVICE_NAME: app
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--reload",
              "gatekeeper.core.app:create_app()"]
    ports:
      - "127.0.0.1:${GATE_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      GATE_SERVICE_NAME: scheduler
    command: ["python", "-m", "gatekeeper.scheduler"]

  # Stands in for Forgeline CI: accepts signed callbacks and appends them to
  # var/ci-mock/callbacks.jsonl. Teams' callback URLs point at http://ci-mock:9100.
  ci-mock:
    <<: *app
    depends_on: []
    environment:
      GATE_SERVICE_NAME: ci-mock
      CI_MOCK_PORT: "9100"
      CI_MOCK_LOG: /app/var/ci-mock/callbacks.jsonl
      CI_MOCK_SECRET: ${CI_MOCK_SECRET-}
      GATE_NOW: ${GATE_NOW-2026-12-02T11:00:00Z}  # timestamps are checked against the dev clock
    command: ["python", "-m", "ci_mock"]

  # One-off container for `make test`; its own database so tests never touch
  # dev data.
  tests:
    <<: *app
    profiles: ["tests"]
    environment:
      <<: *app-env
      GATE_ENV: test
      GATE_SERVICE_NAME: tests
      GATE_LOG_FORMAT: text
      GATE_LOG_LEVEL: WARNING
      GATE_NOW: ""
      DATABASE_URL: postgresql+psycopg://gatekeeper:gatekeeper-demo@db:5432/gatekeeper_test
    command: ["pytest"]

volumes:
  pgdata:
