[project]
name = "tidewright-orchestrator"
version = "1.9.2"
description = "Schedules simulated security checks against registered assets and tracks findings."
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The source tree is bind-mounted into containers: keep pytest from writing
# cache files there (they would be owned by root on the host).
addopts = "-ra -q -p no:cacheprovider --strict-markers"
markers = [
    "committed: test needs real commits across connections (uses the committed_db fixture)",
]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S311",  # random is used for deterministic seeding, not crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"seed/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
