# Public holidays that do not count as SLA business days (Free State of Saxony,
# where Fernwick HQ in Leipzig is). Weekends are skipped by the calendar
# itself; holidays that fall on a Saturday are listed anyway so the file reads
# like the official list. Policy owner: Samuel Okafor (AppSec).
#
# Not included: Corpus Christi (only some Sorbian municipalities in Saxony),
# 24 and 31 December (working days, even if half the building is empty).
#
# TODO(samuel): add 2027 before December. Until then, due dates that land in
# 2027 skip weekends only, and Ledger logs "sla.holidays_missing" (once per
# loaded calendar).

